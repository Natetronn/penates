<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background for the Open Graph images (scripts/sync.mjs renders it to PNG): the site's dark violet, soft
       glows in the logo's colors, and its gradient as a bar along the bottom. -->
  <defs>
    <radialGradient id="violet" cx="0.82" cy="0.18" r="0.55"><stop offset="0" stop-color="#8b5cff" stop-opacity="0.45"/><stop offset="1" stop-color="#8b5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink" cx="1" cy="0" r="0.35"><stop offset="0" stop-color="#ff4fd8" stop-opacity="0.35"/><stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyan" cx="0.62" cy="0.95" r="0.45"><stop offset="0" stop-color="#22e6ff" stop-opacity="0.22"/><stop offset="1" stop-color="#22e6ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#22e6ff"/><stop offset="0.5" stop-color="#8b5cff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0c0b16"/>
  <rect width="1200" height="630" fill="url(#violet)"/>
  <rect width="1200" height="630" fill="url(#pink)"/>
  <rect width="1200" height="630" fill="url(#cyan)"/>
  <rect y="618" width="1200" height="12" fill="url(#bar)"/>
</svg>
