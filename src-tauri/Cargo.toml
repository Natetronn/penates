[package]
name = "penates-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Penates desktop manager and the window each app runs in"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
penates-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
base64 = "0.22"
# "unstable": a window holding two web views (the optional toolbar above the site).
tauri = { version = "2", features = ["image-png", "tray-icon", "unstable"] }
open = "5"
url = "2"
dirs = "5"
tauri-plugin-updater = "2"
# The system folder picker for Settings → export folder (used from Rust only).
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The title bar's height, for placing the toolbar below it (already in the build through wry).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "objc2-core-foundation"] }

[features]
# Production build: serve the embedded UI (set automatically by `cargo tauri build`).
custom-protocol = ["tauri/custom-protocol"]
