[package]
name = "penates-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
penates-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
base64 = "0.22"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
open = "5"
url = "2"
dirs = "5"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }

[features]
# Production build: serve the embedded UI (set automatically by `cargo tauri build`).
custom-protocol = ["tauri/custom-protocol"]
