[workspace]
resolver = "2"
members = ["crates/penates-core", "crates/penates-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
penates-core = { path = "crates/penates-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
