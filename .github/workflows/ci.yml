name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: The Credits list matches Cargo.lock
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/gen-credits.py --check

  # Actually runs the apps on each OS: launcher, launch through it, manager, export/import.
  smoke:
    name: smoke (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb dbus-x11 desktop-file-utils imagemagick
      - run: cargo build --workspace --locked
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- ./scripts/smoke-linux.sh
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ./scripts/smoke-macos.sh
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true   # screenshots are nice to have
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-out/
          retention-days: 1
