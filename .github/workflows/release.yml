# Builds signed installers for every platform when a version tag is pushed (v0.1.0, ...) and attaches
# them to a DRAFT release. Drafts are only visible to the repo's owners; nothing is public until you run
# scripts/publish-release.py <tag>, which adds latest.json and publishes the draft.
#
# Run it by hand (Actions > Release > Run workflow) for a rehearsal: everything is built and signed,
# nothing is uploaded.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Bump with the tauri crate (Cargo.lock); the version must have a tauri-cli-v<version> release on tauri-apps/tauri.
  TAURI_CLI_VERSION: 2.12.6

jobs:
  draft:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in Cargo.toml
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME#v}" != "$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $v (bump the version first)"; exit 1
          fi
      - name: Create the draft release that holds the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft \
              --title "Build $GITHUB_REF_NAME" --notes "Draft build. Publish with scripts/publish-release.py $GITHUB_REF_NAME."

  package:
    needs: draft
    # Also runs for a rehearsal, when the draft job is skipped.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,  bundles: 'deb,rpm,appimage' }
          - { os: macos-latest,  bundles: 'app,dmg' }                                  # Apple Silicon
          - { os: macos-latest,  bundles: 'app,dmg', target: 'x86_64-apple-darwin' }   # Intel, cross-compiled
          - { os: windows-latest, bundles: 'nsis' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No build cache here: a restored target/ could carry installers from an older build into the release.
      - name: Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      # The Tauri project's own prebuilt cargo-tauri (compiling it took 5-7 minutes per job).
      - name: Tauri CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          case "$host" in *-linux-*) ext=tgz ;; *) ext=zip ;; esac
          dir="$(mktemp -d)"
          gh release download "tauri-cli-v$TAURI_CLI_VERSION" -R tauri-apps/tauri \
            -p "cargo-tauri-$host.$ext" -D "$dir"
          if [ "$ext" = tgz ]; then tar -xzf "$dir"/*.tgz -C "$dir"; else unzip -q "$dir"/*.zip -d "$dir"; fi
          bin="$dir/cargo-tauri"; [ -f "$bin.exe" ] && bin="$bin.exe"
          mkdir -p "$HOME/.cargo/bin" && cp "$bin" "$HOME/.cargo/bin/" && chmod +x "$HOME/.cargo/bin/$(basename "$bin")"
          cargo tauri --version
      - name: Build packages
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: ./scripts/build-packages.sh
      - name: Portable tarball (used by the AUR and Arch packages)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: ./scripts/make-tarball.sh
      - name: Keep the tarball for the Arch package
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/penates-*-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
      - name: Collect the release files
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/collect-release-files.sh
      - name: Attach to the draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-files/* --clobber -R "$GITHUB_REPOSITORY"

  arch:
    # The Arch Linux package (sudo pacman -U), built from the tarball on Arch itself.
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-tarball
          path: dist
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder: .
          su builder -c ./scripts/make-arch-package.sh
      - name: Attach to the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pacman -Syu --noconfirm --needed github-cli
          gh release upload "$GITHUB_REF_NAME" dist/penates-bin-[0-9]*-x86_64.pkg.tar.zst --clobber -R "$GITHUB_REPOSITORY"
      - name: Keep it (rehearsal)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/penates-bin-[0-9]*-x86_64.pkg.tar.zst
