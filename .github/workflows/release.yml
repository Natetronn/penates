# Builds signed installers for every platform when a version tag is pushed (v0.1.0, ...) and attaches
# them to a DRAFT release in this private repo. Nothing is public until you run
# scripts/publish-release.py <tag>, which copies them to the public releases repo with latest.json.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create the private draft release that holds the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft \
              --title "Build $GITHUB_REF_NAME" --notes "Private build. Publish with scripts/publish-release.py $GITHUB_REF_NAME."

  package:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,  bundles: 'deb,rpm,appimage' }
          - { os: macos-latest,  bundles: 'app,dmg' }                                  # Apple Silicon
          - { os: macos-latest,  bundles: 'app,dmg', target: 'x86_64-apple-darwin' }   # Intel, cross-compiled
          - { os: windows-latest, bundles: 'nsis' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Build packages
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: ./scripts/build-packages.sh
      - name: Portable tarball (used by the AUR package)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: ./scripts/make-tarball.sh
      - name: Attach to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          ./scripts/collect-release-files.sh
          gh release upload "$GITHUB_REF_NAME" release-files/* --clobber -R "$GITHUB_REPOSITORY"
