# Once a week, append every release file's download count to downloads.csv on the `stats` branch. GitHub
# only keeps running totals; these dated rows give them a history. Table on demand: scripts/downloads.py.
name: Stats
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count the downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/downloads.py --csv > "$RUNNER_TEMP/rows.csv"
      - name: Append them to the stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin stats; then
            git worktree add -q "$RUNNER_TEMP/stats" FETCH_HEAD
            git -C "$RUNNER_TEMP/stats" switch -q -c stats
          else
            git worktree add -q --detach "$RUNNER_TEMP/stats"
            git -C "$RUNNER_TEMP/stats" switch -q --orphan stats
          fi
          cd "$RUNNER_TEMP/stats"
          if [ -f downloads.csv ]; then tail -n +2 "$RUNNER_TEMP/rows.csv" >> downloads.csv; else cp "$RUNNER_TEMP/rows.csv" downloads.csv; fi
          git add downloads.csv
          git commit -q -m "Download counts $(date -u +%F)"
          git push -q origin stats
