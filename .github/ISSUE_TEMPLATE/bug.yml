name: Bug report
description: Something in Penates does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The site, the setting, what you clicked. `penates show <id>` output helps (remove anything private).
  - type: input
    id: version
    attributes:
      label: Penates version and how you installed it
      placeholder: 0.1.0, AppImage
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and desktop
      placeholder: CachyOS, KDE Plasma 6 (Wayland)
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report from Penates
      description: Filled in by About → Report a problem, or `penates report --open`. Recent log lines with personal details removed; check them before submitting.
      render: text
