<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toolbar</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* --tb-* are set by toolbar.js for a site's or a custom color; without them the toolbar uses Penates's colors. */
  html, body { margin: 0; height: 100%; background: var(--tb-bg, var(--card)); color: var(--tb-fg, var(--fg)); font: 13px/1 var(--font); overflow: hidden; user-select: none; }
  body { display: flex; align-items: center; gap: 4px; padding: 0 8px; box-sizing: border-box; border-bottom: 1px solid var(--tb-line, var(--line)); }
  button {
    flex: none; width: 30px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; border-radius: var(--radius);
    background: transparent; color: inherit; cursor: pointer;
  }
  button:hover { background: var(--tb-hover, var(--chip)); }
  button:active { background: var(--tb-line, var(--line)); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #address {
    flex: 1; min-width: 0; height: 26px; margin: 0 4px; padding: 0 10px; border: 1px solid var(--tb-line, var(--line)); border-radius: 999px;
    background: var(--tb-field, var(--bg)); color: var(--tb-muted, var(--muted)); font: 12.5px var(--mono); text-overflow: ellipsis; user-select: text;
  }
  #address:focus { outline: none; border-color: var(--accent); color: var(--tb-fg, var(--fg)); }
  /* While a page loads: a line moving along the bottom edge. */
  #progress { position: fixed; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; visibility: hidden; }
  #progress::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 35%; background: var(--brand-gradient); animation: run 1.1s ease-in-out infinite; }
  body.loading #progress { visibility: visible; }
  @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  @media (prefers-reduced-motion: reduce) { #progress::before { animation: none; width: 100%; opacity: .6; } }
  .when-loading, body.loading .when-idle { display: none; }
  body.loading .when-loading { display: block; }
</style>
</head>
<body>
  <button type="button" data-action="back" title="Back (Alt+←)" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button type="button" data-action="forward" title="Forward (Alt+→)" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <button type="button" id="reload" data-action="reload" title="Reload (F5)" aria-label="Reload"><svg viewBox="0 0 24 24" class="when-idle"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg><svg viewBox="0 0 24 24" class="when-loading"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button type="button" data-action="home" title="Start page (Alt+Home)" aria-label="Start page"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg></button>
  <input id="address" readonly aria-label="Address of this page" spellcheck="false">
  <button type="button" data-action="keys" title="Keys in this app (F1)" aria-label="Keys in this app"><svg viewBox="0 0 24 24"><path d="M3 7h18v10H3zM7 11h.01M11 11h.01M15 11h.01M8 14h8"/></svg></button>
  <button type="button" data-action="browser" title="Open this page in your browser" aria-label="Open in browser"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/></svg></button>
  <div id="progress" aria-hidden="true"></div>
  <script src="toolbar.js"></script>
</body>
</html>
